<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 460px;
      margin: 80px auto;
      background: #fff;
      padding: 36px 28px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .check {
      width: 64px;
      height: 64px;
      line-height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #16a34a;
      color: #fff;
      font-size: 34px;
    }
    h2 {
      margin: 0 0 10px;
    }
    p {
      color: #555;
      margin: 0 0 24px;
    }
    a {
      display: inline-block;
      padding: 10px 22px;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
    }
    a:hover {
      background: #15803d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h2 id="title">Thank you for registering!</h2>
    <p>Your account has been created successfully.</p>
    <a href="form2.html">Back to Registration</a>
  </div>

  <script>
    var name = new URLSearchParams(window.location.search).get("name");
    if (name) {
      document.getElementById("title").textContent = "Thank you for registering, " + name + "!";
    }
  </script>
</body>
</html>
